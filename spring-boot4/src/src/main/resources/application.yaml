spring:
  application:
    name: spring-boot-study
  datasource:
    url: jdbc:h2:file:./db/mydb.h2
    driver-class-name: org.h2.Driver
    username:
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
server:
  port: 8091
